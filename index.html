<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>macOS Tahoe 26.1.0 | HINS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/pyodide@0.25.0/pyodide.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        glassBase: 'rgba(255,255,255,0.08)',
                        glassDark: 'rgba(15,15,20,0.35)',
                        glassStroke: 'rgba(255,255,255,0.12)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            /* Liquid Glass 苹果液态玻璃核心样式 动态光影折射 */
            .liquid-glass {
                background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
                backdrop-filter: blur(22px) saturate(220%);
                -webkit-backdrop-filter: blur(22px) saturate(220%);
                border: 1px solid rgba(255,255,255,0.12);
                box-shadow:
                    0 8px 32px rgba(0,0,0,0.3),
                    inset 0 1px 0 rgba(255,255,255,0.18),
                    inset 0 -1px 0 rgba(0,0,0,0.1);
                transition: all 0.3s cubic-bezier(0.2,0,0.2,1);
            }
            .liquid-glass-dark {
                background: linear-gradient(135deg, rgba(40,40,50,0.35), rgba(20,20,30,0.25));
                backdrop-filter: blur(22px) saturate(220%);
                -webkit-backdrop-filter: blur(22px) saturate(220%);
                border: 1px solid rgba(255,255,255,0.08);
                box-shadow:
                    0 8px 32px rgba(0,0,0,0.4),
                    inset 0 1px 0 rgba(255,255,255,0.08);
                transition: all 0.3s cubic-bezier(0.2,0,0.2,1);
            }
            .hover-liquid:hover {
                background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.06));
                transform: scale(1.02);
            }
            .window-drag { cursor: move; }
            .dock-item { transition: all 0.25s cubic-bezier(0.2,0,0.2,1); }
            .dock-item:hover { transform: translateY(-8px) scale(1.15); }
            .resize-handle { width:10px; height:10px; position:absolute; right:0; bottom:0; cursor:nwse-resize; z-index:10; }
            .menu-dropdown {
                display: none;
                position: absolute;
                top: 28px;
                left: 0;
                @apply liquid-glass-dark rounded-lg py-1 min-w-[140px] z-[9999];
            }
            .menu-item {
                padding: 7px 14px;
                cursor: pointer;
                font-size: 13px;
                @apply hover-liquid;
            }
            .split-line { height: 1px; background: rgba(255,255,255,0.15); margin:6px 0; }
            .menu-parent { position: relative; cursor: pointer; }
            /* 美化滚动条 */
            ::-webkit-scrollbar { width:6px;height:6px; }
            ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.2); border-radius:3px; }
            ::-webkit-scrollbar-track { background:transparent; }
            /* 窗口通用样式 */
            .app-window{
                position:absolute;
                width:600px;height:400px;
                @apply liquid-glass-dark rounded-xl overflow-hidden z-30;
            }
            .win-header{
                height:36px;
                @apply liquid-glass flex items-center justify-between px-3 window-drag;
            }
        }
        body {
            background: url('https://img1.baidu.com/it/u=123124125,3802562127&fm=253&fmt=auto&app=138&f=JPEG?w=1920&h=1080') no-repeat center;
            background-size: cover;
            height: 100vh;
            overflow: hidden;
        }
        .dark body { background: #0c0c10; }
        #contextMenu { display: none; z-index:99999; }
        #rotateTip { display: none; }
        /* 隐藏原生文件选择框 */
        #importFileInput{ display:none; }
    </style>
</head>
<body class="dark text-white overflow-hidden select-none" id="desktop">
<!-- 隐藏导入文件input -->
<input type="file" id="importFileInput" accept=".json">

<!-- 手机竖屏横屏提示弹窗 -->
<div id="rotateTip" class="fixed inset-0 bg-black/85 z-[99999] flex flex-col items-center justify-center p-6 text-center">
    <i class="fa fa-mobile text-6xl mb-4 animate-pulse"></i>
    <h2 class="text-xl mb-2">建议横向旋转屏幕</h2>
    <p class="opacity-70 mb-6">当前为手机竖屏模式，横屏后macOS Tahoe液态玻璃桌面体验更佳</p>
    <button onclick="closeRotateTip()" class="px-6 py-2 liquid-glass rounded-lg">我知道了</button>
</div>

<!-- 桌面右键菜单 -->
<div id="contextMenu" class="fixed liquid-glass-dark rounded-lg py-2 px-2 text-sm w-36">
    <div class="px-2 py-1 hover-liquid rounded cursor-pointer" onclick="triggerVibrate();refreshDesktop()">刷新桌面</div>
    <div class="px-2 py-1 hover-liquid rounded cursor-pointer" onclick="triggerVibrate();openWallpaperPanel()">更换壁纸</div>
    <div class="px-2 py-1 hover-liquid rounded cursor-pointer" onclick="triggerVibrate();closeAllWin()">关闭所有窗口</div>
</div>

<!-- 壁纸选择弹窗 -->
<div id="wallPanel" class="fixed hidden w-[400px] max-w-[90vw] liquid-glass-dark rounded-xl p-4 z-[9998]">

        <span>选择壁纸</span>
        <button onclick="triggerVibrate();wallPanel.classList.add('hidden')">✕</button>

    <div class="grid grid-cols-2 gap-2">
        <button class="p-2 rounded liquid-glass hover-liquid" onclick="triggerVibrate();setWall(1)">默认Tahoe壁纸</button>
        <button class="p-2 rounded liquid-glass hover-liquid" onclick="triggerVibrate();setWall(2)">深空黑壁纸</button>

</div>

<div id="feedbackModal" class="fixed hidden w-[450px] max-w-[92vw] liquid-glass-dark rounded-xl p-5 z-[9999] left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">

    <div class="flex gap-4 items-center">

            <div id="appleMenu" class="menu-dropdown">

        <div class="relative menu-parent"><span class="menu-title">文件</span>

            </div>

            <div class="menu-dropdown">

    <div class="dock-item w-10 h-10 md:w-11 md:h-11 rounded-xl bg-gray-600 flex items-center justify-center text-xl cursor-pointer open-win-btn" data-id="calc" onclick="triggerVibrate()"><i class="fa fa-calculator"></i></div>
    <div class="dock-item w-10 h-10 md:w-11 md:h-11 rounded-xl bg-blue-500 flex items-center justify-center text-xl cursor-pointer open-win-btn" data-id="python" onclick="triggerVibrate()"><i class="fa fa-code"></i></div>
    <div class="dock-item w-10 h-10 md:w-11 md:h-11 rounded-xl bg-black flex items-center justify-center text-xl text-green-400 cursor-pointer open-win-btn" data-id="terminal" onclick="triggerVibrate()"><i class="fa fa-terminal"></i></div>
    <div class="dock-item w-10 h-10 md:w-11 md:h-11 rounded-xl bg-pink-500 flex items-center justify-center text-xl cursor-pointer open-win-btn" data-id="photos" onclick="triggerVibrate()"><i class="fa fa-picture-o"></i></div>
    <div class="dock-item w-10 h-10 md:w-11 md:h-11 rounded-xl bg-red-500 flex items-center justify-center text-xl cursor-pointer open-win-btn" data-id="music" onclick="triggerVibrate()"><i class="fa fa-music"></i></div>
    <div class="dock-item w-10 h-10 md:w-11 md:h-11 rounded-xl bg-slate-500 flex items-center justify-center text-xl cursor-pointer open-win-btn" data-id="setting" onclick="triggerVibrate()"><i class="fa fa-cog"></i></div>

</div>

<script>
// ====================== 全局配置 & 本地存储KEY ======================
const STORAGE_KEY = "tahoe26_config";
let appConfig = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    vibrateStrength:30, // 默认震动强度
    darkMode:true,
    calcHistory:"",
    windowsPos:{},
    bgType:1
};
// 初始化加载配置
document.documentElement.classList.toggle('dark', appConfig.darkMode);
let vibrateStrength = appConfig.vibrateStrength;

// 保存配置到本地存储
function saveConfig(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appConfig));
}

// ====================== 【核心功能】设置导出&导入 ======================
// 导出全部配置为JSON文件下载
function exportAllConfig(){
    triggerVibrate();
    const jsonStr = JSON.stringify(appConfig, null, 2);
    const blob = new Blob([jsonStr], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "macOS_Tahoe_Config.json";
    a.click();
    URL.revokeObjectURL(url);
}
// 导入JSON配置文件
function importAllConfig(){
    triggerVibrate();
    const fileInput = document.getElementById('importFileInput');
    fileInput.onchange = (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.readAsText(file);
        reader.onload = (res)=>{
            try{
                const data = JSON.parse(res.target.result);
                appConfig = data;
                vibrateStrength = appConfig.vibrateStrength;
                document.documentElement.classList.toggle('dark', appConfig.darkMode);
                saveConfig();
                alert("✅ 配置导入成功！刷新页面即可全部生效");
            }catch(err){
                alert("❌ 文件格式错误，请选择正确的JSON配置文件");
                console.error(err);
            }
            fileInput.value = "";
        }
    }
    fileInput.click();
}

// ====================== 震动函数（仅手机端生效） ======================
function triggerVibrate() {
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isMobile && navigator.vibrate) {
        navigator.vibrate(vibrateStrength);
    }
}

// ====================== 全屏切换 ======================
function toggleFullscreen() {
    const fullBtn = document.getElementById('fullscreenBtn');
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        fullBtn.innerHTML = '<i class="fa fa-compress"></i>';
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
        fullBtn.innerHTML = '<i class="fa fa-expand"></i>';
    }
}

// 明暗模式切换
function toggleDark(){
    appConfig.darkMode = !appConfig.darkMode;
    document.documentElement.classList.toggle('dark', appConfig.darkMode);
    saveConfig();
}

// ====================== 窗口管理、时间、菜单、壁纸等原有函数 ======================
function checkDevice() {
    const rotateTip = document.getElementById('rotateTip');
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isPortrait = window.innerHeight > window.innerWidth;
    if (isMobile && isPortrait) rotateTip.style.display = "flex";
}
function closeRotateTip(){ document.getElementById('rotateTip').style.display = "none"; }
window.addEventListener('resize', checkDevice);
checkDevice();

// 关闭所有下拉菜单
const allMenus = document.querySelectorAll('.menu-dropdown');
document.querySelectorAll('.menu-parent').forEach(parent=>{
    const menu = parent.querySelector('.menu-dropdown');
    parent.onclick=(e)=>{
        e.stopPropagation();
        allMenus.forEach(m=>m.style.display='none');
        menu.style.display = menu.style.display==='block'?'none':'block';
        triggerVibrate();
    }
})
document.addEventListener('cl
