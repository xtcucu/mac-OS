<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desktop OS Custom | Config Import&Export</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        glass: 'rgba(255,255,255,0.1)',
                        glassDark: 'rgba(18,18,26,0.45)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                backdrop-filter: blur(26px) saturate(180%);
                -webkit-backdrop-filter: blur(26px) saturate(180%);
                background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
                border: 1px solid rgba(255,255,255,0.1);
                box-shadow: 0 10px 40px rgba(0,0,0,0.35);
            }
            .glass-dark-panel {
                backdrop-filter: blur(26px) saturate(180%);
                -webkit-backdrop-filter: blur(26px) saturate(180%);
                background: linear-gradient(145deg, rgba(60,60,80,0.25), rgba(10,10,20,0.5));
                border: 1px solid rgba(255,255,255,0.07);
            }
            .win-drag { cursor: move; }
            .btn-hover { transition: 0.2s ease; }
            .btn-hover:hover { background: rgba(255,255,255,0.15); transform: scale(1.02); }
        }
        body {
            background: #0b0b13 url('https://picsum.photos/id/1036/1920/1080') center/cover no-repeat;
            height: 100vh;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius:4px; }
        #fileInput { display: none; }
    </style>
</head>
<body class="dark text-white overflow-hidden select-none">
<input type="file" id="fileInput" accept=".json">

<!-- 顶部状态栏 -->
<div class="fixed top-0 left-0 right-0 h-8 glass-panel flex items-center justify-between px-5 z-50 text-sm">
    <div class="flex gap-6 items-center">
        <span class="font-medium cursor-pointer" id="logoBtn"><i class="fa fa-desktop mr-1"></i>System OS</span>
        <span class="cursor-pointer" onclick="openApp('settings')">设置</span>
        <span class="cursor-pointer" onclick="openApp('calculator')">计算器</span>
        <span class="cursor-pointer" onclick="openApp('audio')">音频控制台</span>
    </div>
    <div class="flex gap-4 items-center">
        <button onclick="toggleFullscreen()"><i class="fa fa-expand"></i></button>
        <span id="timeShow"></span>
    </div>
</div>

<!-- 窗口容器 -->
<div id="windowContainer" class="w-full h-full pt-8"></div>

<!-- 底部Dock栏 -->
<div class="fixed bottom-4 left-1/2 -translate-x-1/2 glass-dark-panel rounded-2xl px-3 py-2 flex gap-2 z-40">
    <div class="w-11 h-11 rounded-xl bg-blue-600 flex items-center justify-center text-xl cursor-pointer btn-hover" onclick="openApp('calculator')">
        <i class="fa fa-calculator"></i>
    </div>
    <div class="w-11 h-11 rounded-xl bg-purple-600 flex items-center justify-center text-xl cursor-pointer btn-hover" onclick="openApp('audio')">
        <i class="fa fa-music"></i>
    </div>
    <div class="w-11 h-11 rounded-xl bg-slate-600 flex items-center justify-center text-xl cursor-pointer btn-hover" onclick="openApp('settings')">
        <i class="fa fa-cog"></i>
    </div>
    <div class="w-[1px] h-8 bg-white/20 mx-1"></div>
    <div class="w-11 h-11 rounded-xl bg-red-600 flex items-center justify-center text-xl cursor-pointer btn-hover" onclick="closeAllWindow()">
        <i class="fa fa-times"></i>
    </div>
</div>

<script>
// 本地存储配置项
const STORAGE_KEY = "custom_desktop_config";
let systemConfig = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    vibrateLevel: 25,
    darkMode: true,
    calcRecord: "",
    windowPositions: {},
    audioVolume: 70
};

// 保存配置
function saveConfig() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(systemConfig));
}

// 导出配置文件
function exportConfig() {
    const blob = new Blob([JSON.stringify(systemConfig, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "System_Setting_Backup.json";
    a.click();
    URL.revokeObjectURL(url);
}

// 导入配置文件
function importConfig() {
    const input = document.getElementById("fileInput");
    input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.readAsText(file);
        reader.onload = res => {
            try {
                systemConfig = JSON.parse(res.target.result);
                saveConfig();
                alert("配置导入完成，重启窗口生效");
            } catch {
                alert("文件格式错误，请选择正确JSON配置文件");
            }
            input.value = "";
        }
    }
    input.click();
}

// 手机震动触发
function vibrateTap() {
    const isMobile = /Android|iPhone/i.test(navigator.userAgent);
    if (isMobile && navigator.vibrate) navigator.vibrate(systemConfig.vibrateLevel);
}

// 全屏切换
function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
}

// 时间更新
function updateTime() {
    const now = new Date();
    document.getElementById("timeShow").innerText = now.toLocaleTimeString("zh-CN", {hour:'2-digit', minute:'2-digit'});
}
setInterval(updateTime,1000);
updateTime();

const winBox = document.getElementById("windowContainer");
// 关闭所有窗口
function closeAllWindow() { winBox.innerHTML = ""; }

// 打开应用窗口
function openApp(appId) {
    vibrateTap();
    if(document.getElementById(`win_${appId}`)) return;
    let posX = systemConfig.windowPositions[appId]?.x || 120;
    let posY = systemConfig.windowPositions[appId]?.y || 100;
    let innerContent = "";

    if(appId === "settings") {
        innerContent = `
        <div class="p-5 overflow-auto h-full">
            <h2 class="text-xl font-medium mb-5">系统设置中心</h2>

            <div class="glass-panel p-4 rounded-xl mb-4">
                <div class="flex justify-between items-center mb-2">
                    <span>点击震动强度</span>
                    <span id="vibText">${systemConfig.vibrateLevel}ms</span>
                </div>
                <input type="range" min="0" max="100" value="${systemConfig.vibrateLevel}"
                class="w-full" oninput="changeVibrate(this.value)">
                <p class="text-xs opacity-60 mt-1">仅移动端设备生效，0=关闭震动</p>
            </div>

            <div class="glass-panel p-4 rounded-xl mb-4">
                <div class="flex justify-between items-center mb-2">
                    <span>媒体默认音量</span>
                    <span>${systemConfig.audioVolume}%</span>
                </div>
                <input type="range" min="0" max="100" value="${systemConfig.audioVolume}"
                class="w-full" oninput="changeVolume(this.value)">
            </div>

            <div class="glass-panel p-4 rounded-xl">
                <h3 class="mb-3">配置备份与恢复</h3>
                <div class="flex gap-3">
                    <button onclick="exportConfig()" class="glass-panel px-4 py-2 rounded-lg btn-hover">导出全部设置</button>
                    <button onclick="importConfig()" class="glass-panel px-4 py-2 rounded-lg btn-hover">导入配置文件</button>
                </div>
                <p class="text-xs opacity-60 mt-2">备份内容：震动、音量、计算器记录、窗口位置</p>
            </div>
        </div>`;
    }

    if(appId === "calculator") {
        innerContent = `
        <div class="p-3 h-full flex flex-col">
            <input id="calcInput" readonly value="${systemConfig.calcRecord}"
            class="w-full p-3 text-right text-2xl bg-black/30 rounded mb-4 outline-none">
            <div class="grid grid-cols-4 gap-2 flex-1">
                <button onclick="calcAdd('');saveCalcData()" class="glass-panel rounded btn-hover">AC</button>
                <button onclick="calcAdd('/');saveCalcData()" class="glass-panel rounded btn-hover">/</button>
                <button onclick="calcAdd('*');saveCalcData()" class="glass-panel rounded btn-hover">×</button>
                <button onclick="calcAdd('-');saveCalcData()" class="glass-panel rounded btn-hover">-</button>

                <button onclick="calcAdd('7');saveCalcData()" class="glass-panel rounded btn-hover">7</button>
                <button onclick="calcAdd('8');saveCalcData()" class="glass-panel rounded btn-hover">8</button>
                <button onclick="calcAdd('9');saveCalcData()" class="glass-panel rounded btn-hover">9</button>
                <button onclick="calcAdd('+');saveCalcData()" class="glass-panel rounded btn-hover">+</button>

                <button onclick="calcAdd('4');saveCalcData()" class="glass-panel rounded btn-hover">4</button>
                <button onclick="calcAdd('5');saveCalcData()" class="glass-panel rounded btn-hover">5</button>
                <button onclick="calcAdd('6');saveCalcData()" class="glass-panel rounded btn-hover">6</button>
                <button onclick="calcResult()" class="glass-panel rounded btn-hover row-span-2">=</button>

                <button onclick="calcAdd('1');saveCalcData()" class="glass-panel rounded btn-hover">1</button>
                <button onclick="calcAdd('2');saveCalcData()" class="glass-panel rounded btn-hover">2</button>
                <button onclick="calcAdd('3');saveCalcData()" class="glass-panel rounded btn-hover">3</button>

                <button onclick="calcAdd('0');saveCalcData()" class="glass-panel rounded btn-hover col-span-2">0</button>
                <button onclick="calcAdd('.');saveCalcData()" class="glass-panel rounded btn-hover">.</button>
            </div>
        </div>`;
    }

    if(appId === "audio") {
        innerContent = `
        <div class="p-5 flex flex-col items-center justify-center h-full gap-6">
            <i class="fa fa-music text-6xl opacity-70"></i>
            <div class="flex gap-4">
                <button id="audioPlayBtn" class="glass-panel px-5 py-3 rounded-xl text-lg btn-hover">
                    <i class="fa fa-play"></i> 播放
                </button>
                <button onclick="audioPause()" class="glass-panel px-5 py-3 rounded-xl text-lg btn-hover">
                    <i class="fa fa-pause"></i> 暂停
                </button>
            </div>
            <p class="opacity-60 text-sm">播放声音可在设置内调整默认音量</p>
            <audio id="bgAudio" loop volume="${systemConfig.audioVolume/100}" src="https://www.soundhelix.com/examples/mp3/SoundEffects/Click.mp3">
        </div>`;
    }

    // 创建窗口DOM
    const win = document.createElement("div");
    win.id = `win_${appId}`;
    win.className = "absolute w-[520px] h-[420px] glass-dark-panel rounded-xl overflow-hidden z-20";
    win.style.left = posX + "px";
    win.style.top = posY + "px";
    win.innerHTML = `
        <div class="h-8 glass-panel flex items-center justify-between px-3 win-drag">
            <div class="flex gap-2">
                <span onclick="closeSingleWin('${appId}')" class="text-red-400 cursor-pointer">●</span>
                <span class="text-yellow-400">●</span>
                <span class="text-green-400">●</span>
            </div>
            <span class="text-xs">${appId}</span>
            <div></div>
        </div>
        <div class="h-[calc(100%-32px)] overflow-hidden">${innerContent}</div>
    `;
    winBox.appendChild(win);
    dragWindow(win, appId);
}

// 窗口拖拽+保存位置
function dragWindow(el, id) {
    const header = el.querySelector(".win-drag");
    let drag = false, sX, sY, oX, oY;
    header.onmousedown = e => {
        drag = true;
        sX = e.clientX; sY = e.clientY;
        oX = el.offsetLeft; oY = el.offsetTop;
        el.style.zIndex = 99;
    }
    document.onmousemove = e => {
        if(!drag) return;
        const nx = oX + (e.clientX - sX);
        const ny = oY + (e.clientY - sY);
        el.style.left = nx + "px";
        el.style.top = ny + "px";
        systemConfig.windowPositions[id] = {x:nx, y:ny};
        saveConfig();
    }
    document.onmouseup = () => { drag = false; el.style.zIndex = 20; }
}

// 关闭单个窗口
function closeSingleWin(id) {
    document.getElementById(`win_${id}`)?.remove();
}

// 计算器相关函数
function calcAdd(val) {
    const input = document.getElementById("calcInput");
    if(val === "") input.value = "";
    else input.value += val;
}
function saveCalcData() {
    systemConfig.calcRecord = document.getElementById("calcInput").value;
    saveConfig();
}
function calcResult() {
    try {
        const input = document.getElementById("calcInput");
        input.value = eval(input.value);
        saveCalcData();
    } catch {
        document.getElementById("calcInput").value = "错误";
    }
}

// 修改震动强度
function changeVibrate(val) {
    systemConfig.vibrateLevel = Number(val);
    document.getElementById("vibText").innerText = val + "ms";
    saveConfig();
    vibrateTap();
}

// 修改音量
function changeVolume(val) {
    systemConfig.audioVolume = Number(val);
    saveConfig();
    const audio = document.getElementById("bgAudio");
    if(audio) audio.volume = val/100;
}

// 音频控制
function audioPause() {
    const audio = document.getElementById("bgAudio");
    if(audio) audio.pause();
}
document.getElementById("windowContainer").addEventListener("click",(e)=>{
    if(e.target.id === "audioPlayBtn"){
        document.getElementById("bgAudio").play();
    }
})
</script>
</body>
</html>
